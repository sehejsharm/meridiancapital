<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Meridian Capital">
  <defs>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2DA92"/>
      <stop offset="38%"  stop-color="#D4AF37"/>
      <stop offset="72%"  stop-color="#B8912B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="auV" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#F2DA92"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7620"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#050506"/>

  <!-- outer ring and graduation -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#au)" stroke-width="5"/>
  <circle cx="256" cy="256" r="203" fill="none" stroke="url(#au)" stroke-width="1.6"
          stroke-dasharray="7 13" opacity="0.75"/>

  <!-- concentric bearings -->
  <circle cx="256" cy="256" r="167" fill="none" stroke="url(#au)" stroke-width="2" opacity="0.9"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#au)" stroke-width="1.7" opacity="0.72"/>
  <circle cx="256" cy="256" r="99"  fill="none" stroke="url(#au)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="256" cy="256" r="68"  fill="none" stroke="url(#au)" stroke-width="1.3" opacity="0.4"/>

  <!-- intercardinal spokes -->
  <g stroke="url(#au)" stroke-width="7" stroke-linecap="round" opacity="0.95">
    <line x1="139" y1="139" x2="212" y2="212"/>
    <line x1="373" y1="139" x2="300" y2="212"/>
    <line x1="139" y1="373" x2="212" y2="300"/>
    <line x1="373" y1="373" x2="300" y2="300"/>
  </g>

  <!-- cardinal points -->
  <path d="M256 36 L272 232 L256 256 L240 232 Z" fill="url(#auV)"/>
  <path d="M256 476 L272 280 L256 256 L240 280 Z" fill="url(#auV)"/>
  <path d="M36 256 L232 240 L256 256 L232 272 Z" fill="url(#au)"/>
  <path d="M476 256 L280 240 L256 256 L280 272 Z" fill="url(#au)"/>

  <!-- hub -->
  <circle cx="256" cy="256" r="30" fill="#050506" stroke="url(#au)" stroke-width="6"/>
  <circle cx="256" cy="256" r="12" fill="url(#au)"/>
</svg>
