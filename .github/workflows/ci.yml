name: CI

# Every push and every pull request. The suite is the only thing standing
# between a bad edit and an engine that trades on it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -q -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q
        env:
          # The suite must never reach a real broker, and conftest points the
          # data directory at a temporary one.
          MERIDIAN_TRADING_MODE: paper
          MERIDIAN_AUTOSTART: "0"

  frontend:
    name: Dashboard — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # P&L, reconciliation and strategy-config display: a silent regression
      # there costs real money.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build
        env:
          # Read per-request, not at build time; a placeholder is enough to
          # prove the build, and the real value lives in Vercel.
          MERIDIAN_API_URL: https://ci.invalid

  gate:
    name: Acceptance gate accepts the reference strategy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r requirements.txt

      # A gate that stops accepting the built-in build is broken, and it would
      # block every upload without anyone noticing until they tried one.
      - name: Gate the built-in strategy
        run: |
          # Through a pipe, as the API reads it: the gate forbids writing files
          # (RLIMIT_FSIZE 0), so a redirect straight into one loses the report.
          python -m engine.gate_runner < engine/builtin_gk50k.py | cat > report.json
          python - <<'PY'
          import json, sys
          r = json.load(open("report.json"))
          failed = [c["key"] for c in r["checks"] if not c["passed"]]
          print(f"passed={r['passed']} checks={r['total']} failed={failed}")
          if not r["passed"]:
              sys.exit("the acceptance gate rejected its own reference strategy")
          PY

  site:
    name: Every page opens, phone and desktop
    # Pinned: the pinned Playwright cannot install its browser on a newer image than this.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -q -r backend/requirements.txt
          cd frontend && npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the dashboard
        working-directory: frontend
        run: npx next build
        env:
          MERIDIAN_API_URL: http://127.0.0.1:8090
      # A throwaway API with made-up data and no broker, the built dashboard, and a
      # browser that opens every page at 390 px and 1366 px. Fails on a page error,
      # a page that will not load, or any sideways scroll.
      - name: Open every page
        run: |
          python backend/scripts/site_check_server.py "$RUNNER_TEMP/site-check" > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd frontend && npx next start -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1 && curl -fsS -o /dev/null http://127.0.0.1:3100/login 2>/dev/null; then break; fi
            sleep 1
          done
          cd frontend && node scripts/site-check.cjs "$(cat "$RUNNER_TEMP/site-check/trade_id")" || { tail -n 30 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/next.log"; exit 1; }
        env:
          MERIDIAN_API_URL: http://127.0.0.1:8090
