name: CI

# Every push and every pull request. The suite is the only thing standing
# between a bad edit and an engine that trades on it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -q -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q
        env:
          # The suite must never reach a real broker, and conftest points the
          # data directory at a temporary one.
          MERIDIAN_TRADING_MODE: paper
          MERIDIAN_AUTOSTART: "0"

  frontend:
    name: Dashboard — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          # Read per-request, not at build time; a placeholder is enough to
          # prove the build, and the real value lives in Vercel.
          MERIDIAN_API_URL: https://ci.invalid

  gate:
    name: Acceptance gate accepts the reference strategy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r requirements.txt

      # A gate that stops accepting the built-in build is broken, and it would
      # block every upload without anyone noticing until they tried one.
      - name: Gate the built-in strategy
        run: |
          python -m engine.gate_runner < engine/builtin_gk50k.py > report.json
          python - <<'PY'
          import json, sys
          r = json.load(open("report.json"))
          failed = [c["key"] for c in r["checks"] if not c["passed"]]
          print(f"passed={r['passed']} checks={r['total']} failed={failed}")
          if not r["passed"]:
              sys.exit("the acceptance gate rejected its own reference strategy")
          PY
